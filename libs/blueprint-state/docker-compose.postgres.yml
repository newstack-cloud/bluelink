services:
  db:
    image: postgres:18.6
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 45432:5432

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080
