sonar.projectKey=newstack-cloud_bluelink-blueprint-state
sonar.organization=newstack-cloud

sonar.projectName=Bluelink Blueprint State
sonar.projectVersion=1.0

sonar.sources=.
sonar.exclusions=**/*_test.go,internal/*.go,objectstore/internal/*.go

# Migrations are append-only and repeat each other by nature, a column added to a table
# and to the views over it reads as duplication of the migration that added the last one.
# Excluded from duplication detection only, so they are still analysed for everything else.
sonar.cpd.exclusions=**/migrations/**/*.sql

sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.txt

sonar.go.tests.reportPaths=report.json

sonar.go.govet.reportPaths=govet-report.out

sonar.go.golint.reportPaths=staticcheck.out

sonar.sourceEncoding=UTF-8