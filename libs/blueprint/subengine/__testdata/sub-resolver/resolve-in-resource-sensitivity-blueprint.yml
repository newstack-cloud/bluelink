version: 2025-11-02
variables:
  secretRegionsJSON:
    type: string
    description: "A JSON-encoded list of regions."
    secret: true

  plainRegionsJSON:
    type: string
    description: "A JSON-encoded list of regions."

  dbPassword:
    type: string
    description: "The password for the orders database."
    secret: true
  environment:
    type: string
    description: "The environment the resources are deployed to."

values:
  adminToken:
    type: string
    secret: true
    value: "token-${variables.environment}"

  secretRegionList:
    type: array
    secret: true
    value: "${jsondecode(variables.plainRegionsJSON)}"

  # Declares nothing itself. One field holds a secret and one does not, and resolving either
  # resolves the whole value, so both are recorded against it.
  connection:
    type: object
    value:
      host: "db-${variables.environment}.example.com"
      password: "${variables.dbPassword}"

datasources:
  network:
    type: aws/vpc
    filter:
      field: tags
      operator: "not contains"
      search: "retired"
    exports:
      vpcId:
        type: string
      # Declared sensitive by the data source's spec schema, not here.
      privateKey:
        type: string
      # Reads a sensitive field under another name, so the declaration has to be found
      # through the alias.
      aliasedPrivateKey:
        type: string
        aliasFor: privateKey
      # Named after a field the plugin returns that is sensitive, while declaring an alias
      # to one that is not. A read takes the field matching the name, so this serves the
      # secret; following the alias instead would report it as safe.
      secretArn:
        type: string
        aliasFor: vpcId

  # Its filter reads a computed field, so its own substitutions can only resolve at deploy
  # time and resolution returns it alongside that deferral.
  deferredNetwork:
    type: aws/vpc
    filter:
      field: tags
      operator: "not contains"
      search: "${auditTable.spec.id}"
    exports:
      privateKey:
        type: string

resources:
  auditTable:
    type: aws/dynamodb/table
    spec:
      region: "eu-west-2"

  parameterTree:
    type: example/sensitiveContainer
    spec:
      name: "orders-parameters"
      secureValues:
        dbPassword: "${variables.dbPassword}"
      credentials:
        username: "orders-service"
        nested:
          token: "nested-token"

  # Its spec holds a secret only by interpolation, so nothing in the schema says so and a
  # reference to it can only be marked from what resolution recorded.
  interpolatedTable:
    type: aws/dynamodb/table
    metadata:
      annotations:
        # An identifier-like key, which the generic reference renderer would spell with a
        # dot while recording always brackets.
        auditKey: "audit-${variables.dbPassword}"
        plainKey: "nothing-secret"
      custom:
        auditKey: "audit-${variables.dbPassword}"
        plainKey: "nothing-secret"
    spec:
      tableName: "orders-${variables.dbPassword}"
      region: "eu-west-2"
      # Its name has the secret-holding field's name as a prefix. A prefix test that does
      # not stop at a separator would read "spec.tableName" as covering this.
      tableNameSuffix: "plain-suffix"
      # The first item resolves to none and is dropped, so the secret lands at resolved
      # index 0 and the plain region at 1. A reference built from source indices would
      # read these the other way round.
      replicaRegions:
        - ${coalesce(none, none)}
        - "replica-${variables.dbPassword}"
        - "eu-west-1"

  # Expands over a list derived from a secret, so every item is secret-derived and any
  # field reading one holds a secret.
  secretTemplate:
    type: aws/dynamodb/table
    each: "${jsondecode(variables.secretRegionsJSON)}"
    spec:
      region: "${elem.region}"
      tableName: "orders-${elem.name}"

  # Fed by a value declared secret rather than by a secret variable directly, so the mark
  # has to be recorded against "each" and not against the value's own element.
  valueFedTemplate:
    type: aws/dynamodb/table
    each: "${values.secretRegionList}"
    spec:
      region: "${elem.region}"

  plainTemplate:
    type: aws/dynamodb/table
    each: "${jsondecode(variables.plainRegionsJSON)}"
    spec:
      region: "${elem.region}"

  # Reads nothing but a child blueprint's exports, so the deploy-time route can be resolved
  # without priming state for anything else.
  childReader:
    type: aws/dynamodb/table
    spec:
      tableName: "${children.coreInfra.dbPassword}"
      region: "${children.coreInfra.region}"

  ordersTable:
    type: aws/dynamodb/table
    metadata:
      displayName: "Orders table for ${variables.environment}"
      annotations:
        # One annotation holds a secret and one does not. Each entry carries its own keyed
        # path, so the secret is recorded against that entry rather than the whole map.
        "audit.key": "audit-${variables.dbPassword}"
        "audit.enabled": true
        # Holds a character %q would escape. The change generator does not escape, so an
        # escaped recording would not match the path it renders.
        'audit"quoted': "quoted-${variables.dbPassword}"
      custom:
        # Outside the spec, so it travels on the result rather than the resource.
        auditKey: "audit-${variables.dbPassword}"
    spec:
      tableName: "${variables.environment}-ordersTable"
      # Neither field is declared sensitive in the resource type's schema; one holds a
      # secret and one does not.
      connectionString: "postgres://user:${variables.dbPassword}@host/orders"
      # Both reference the same secret value, which resolution memoises after the first.
      primaryToken: "${values.adminToken}"
      secondaryToken: "${values.adminToken}"
      # References into another resource. All but the last address fields inside containers
      # that resource declares sensitive; the last a field it declares nothing about.
      referencedPassword: "${resources.parameterTree.spec.secureValues.dbPassword}"
      referencedUsername: "${resources.parameterTree.spec.credentials.username}"
      # Two levels below the field declaring sensitivity.
      referencedNestedToken: "${resources.parameterTree.spec.credentials.nested.token}"
      referencedName: "${resources.parameterTree.spec.name}"
      # A data source export the plugin declares sensitive, and one it does not.
      vpcPrivateKey: "${datasources.network.privateKey}"
      vpcId: "${datasources.network.vpcId}"
      aliasedKey: "${datasources.network.aliasedPrivateKey}"
      secretArn: "${datasources.network.secretArn}"
      deferredKey: "${datasources.deferredNetwork.privateKey}"
      # Reads a field of another resource that holds an interpolated secret, and a field of
      # the same resource that does not.
      interpolatedTableName: "${resources.interpolatedTable.spec.tableName}"
      interpolatedTableRegion: "${resources.interpolatedTable.spec.region}"
      interpolatedTableNameSuffix: "${resources.interpolatedTable.spec.tableNameSuffix}"
      # Metadata has no schema, so these can only be marked from what resolution recorded
      # against the referenced resource.
      interpolatedAuditKey: "${resources.interpolatedTable.metadata.custom.auditKey}"
      referencedAnnotation: "${resources.interpolatedTable.metadata.annotations.auditKey}"
      referencedPlainAnnotation: "${resources.interpolatedTable.metadata.annotations.plainKey}"
      interpolatedPlainKey: "${resources.interpolatedTable.metadata.custom.plainKey}"
      replicaSecret: "${resources.interpolatedTable.spec.replicaRegions[0]}"
      replicaPlain: "${resources.interpolatedTable.spec.replicaRegions[1]}"
      # Reads the secret field of a value declaring nothing, twice, so the second read is
      # served from the value cache.
      connectionPassword: "${values.connection.password}"
      connectionPasswordAgain: "${values.connection.password}"
      connectionHost: "${values.connection.host}"
      # Read from a child blueprint's exports. The child resolves against its own record,
      # so the only thing the parent has to go on is what the child reported.
      childSecret: "${children.coreInfra.dbPassword}"
      childPlain: "${children.coreInfra.region}"
      # A secret reaching a field through a function call.
      trimmedToken: "${trim(variables.dbPassword)}"
      replicaRegions:
        - "eu-west-2"
        - "key-${variables.dbPassword}"
      # The first item resolves to none and is dropped from the resolved array, so the
      # secret below it lands at index 0 rather than the index it occupies here.
      backupRegions:
        - ${coalesce(none, none)}
        - "backup-${variables.dbPassword}"

include:
  coreInfra:
    path: core-infra.yaml
    description: "Core infrastructure for ${variables.environment}."
    variables:
      region: "eu-west-2"
      # The include's own variable declares nothing, so the mark has to come from the source.
      dbPassword: "${variables.dbPassword}"
      parameterPassword: "${resources.parameterTree.spec.secureValues.dbPassword}"
    metadata:
      sourceType: aws/s3
      # Outside the variables, and still a secret reaching the include.
      auditKey: "audit-${values.adminToken}"

exports:
  environment:
    type: string
    field: variables.environment
    description: "The environment the blueprint deploys to."

  dbPassword:
    type: string
    field: variables.dbPassword

  parameterPassword:
    type: string
    field: resources.parameterTree.spec.secureValues.dbPassword

  connectionHost:
    type: string
    field: values.connection.host

# Blueprint-wide metadata, resolved as a bare mapping node rather than as part of a
# resource, so its marks come back on the result.
metadata:
  build: esbuild
  auditKey: "audit-${variables.dbPassword}"
  # Needs bracket quoting, which the root of a bare mapping node does not get for free.
  "audit.key": "dotted-${variables.dbPassword}"
  # A sibling whose change path is what the dotted key renders to unquoted, so an unquoted
  # recording would mark this public value instead.
  audit:
    key: "totally-public"
  nested:
    inner: "inner-${variables.dbPassword}"
  # Reads a value, so resolving it records against that value's element too.
  fromValue: "${values.connection.host}"
