version: 2025-11-02
resources:
  # Two functions, each with its own table, so the two links share nothing at all.
  #
  # A link becomes ready when the last of its two resources is deployed, and a table is
  # the priority resource of a function-to-table link, so each function completing
  # releases its own link. The scheduler dispatches links as they are released rather
  # than assembling a batch per resource completion, so two links released moments apart
  # still run together.
  #
  # This fixture used to give both functions one shared table. That was not about what is
  # being measured: batches were serialised against one another, so the only way to get
  # two links running at once was to have a single resource completion release both, and
  # sharing a table was how that was arranged. With the batching gone, sharing the table
  # would now mean sharing a resource, which the scheduler deliberately keeps apart, and
  # the fixture would be measuring the opposite of what it claims.
  ordersTable:
    type: aws/dynamodb/table
    description: "The table saveOrderFunction links to."
    metadata:
      displayName: Orders Table
      labels:
        app: orders
    spec:
      tableName: "orders"
      region: "eu-west-2"

  customersTable:
    type: aws/dynamodb/table
    description: "The table saveCustomerFunction links to."
    metadata:
      displayName: Customers Table
      labels:
        app: customers
    spec:
      tableName: "customers"
      region: "eu-west-2"

  saveOrderFunction:
    type: aws/lambda/function
    description: "Links to the orders table."
    linkSelector:
      byLabel:
        app: orders
    spec:
      handler: "src/saveOrder.handler"

  saveCustomerFunction:
    type: aws/lambda/function
    description: "Links to the customers table."
    linkSelector:
      byLabel:
        app: customers
    spec:
      handler: "src/saveCustomer.handler"
