version: 2025-11-02
resources:
  seedTable:
    type: aws/dynamodb/table
    description: "Referenced by the function, which puts the function in a later group."
    spec:
      tableName: "seed"
      region: "eu-west-2"

  handlerFunction:
    type: aws/lambda/function
    description: "The resource the gateway depends on through a soft link."
    metadata:
      labels:
        api: main
    spec:
      handler: "src/${resources.seedTable.spec.tableName}.handler"

  httpApi:
    type: aws/gateway2/api
    description: "Depends on the function by link priority, with nothing to order it after."
    linkSelector:
      byLabel:
        api: main
    spec:
      apiName: "main-api"
