# Locations of the plugin source repositories on your machine, used by
# scripts/build-local-plugins.sh to build plugins into the local plugin
# directory tree the deploy engine reads when running locally.
#
# Copy this file to local-plugins.conf and adjust the directories,
# local-plugins.conf is not tracked in version control as the locations are
# specific to your machine.
#
# Each line is of the form:
#
#   provider|transformer <namespace>/<name>=<source directory>[@<version>]
#
# The source directory is the directory holding the plugin's main package and a
# leading "~/" is expanded. When no version is given it is derived from the
# latest git tag in the source directory's repository, falling back to
# 0.0.0-dev when there are no tags.
#
# Blank lines and lines starting with "#" are ignored.

provider newstack-cloud/aws=~/repos/bluelink-provider-aws
transformer newstack-cloud/celerity=~/repos/bluelink-transformer-celerity
